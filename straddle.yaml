# iface-espnow — RNS-over-ESP-NOW interface for reticulous.
#
# Bridges RNS packets over Espressif's connectionless ESP-NOW link using
# the chip's long-range PHY. Single broadcast peer; one RNS packet = one
# ESP-NOW v2 frame, with a 4-byte magic prefix tagging our traffic.
# spangap-net owns the WiFi radio; ESP-NOW gates on it, so spangap-net is
# a hard dependency.
schema_version: 1
name: reticulous/iface-espnow
prefix: rns_espnow
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - reticulous/rns
  # spangap-net owns the WiFi radio. ESP-NOW only needs the radio started,
  # so the task pulls in net.h for netIsUp() and the NET_EV_UP/DOWN events
  # and asks net to bring WiFi up.
  - spangap/spangap-net
# Boot-registered service: the generated dispatcher constructs EspnowService and
# calls EspnowService::onInit(), which self-registers with rnsd via ITS.
# `requires: reticulous/rns` puts rnsd ahead of it in dependency-topo order, so
# its port surface is up first.
services:
  - { class: EspnowService, header: espnow.h }


# Declarative settings: both surfaces + storage defaults generated from this
# block. The conflict explanation and the status lines are strings espnow.cpp
# publishes finished.
settings:
  - at:
      - { id: reticulum }
      - { id: espnow, label: "ESPnow", short: "ESPnow", order: 5 }
    rows:
      - section: "ESPnow"
      - caption: "RNS over ESP-NOW on the chip's long-range PHY. Every node on the same 2.4 GHz channel hears every packet. Requires WiFi to be up; while associated to an access point the channel is fixed by that AP."
      # espnow.cpp composes the whole explanation, and publishes it empty when
      # there is no conflict — which is also what gates the row showing it.
      - value: { label: "Conflict", key: "espnow.conflict_note" }
        when_key: espnow.conflict_note
      - switch: { label: "Enabled", key: "s.espnow.enable", default: 0 }
      - dropdown:
          label: "WiFi channel"
          key: "s.espnow.channel"
          default: 1
          options:
            - { v: 1,  l: "1" }
            - { v: 2,  l: "2" }
            - { v: 3,  l: "3" }
            - { v: 4,  l: "4" }
            - { v: 5,  l: "5" }
            - { v: 6,  l: "6" }
            - { v: 7,  l: "7" }
            - { v: 8,  l: "8" }
            - { v: 9,  l: "9" }
            - { v: 10, l: "10" }
            - { v: 11, l: "11" }
            - { v: 12, l: "12 (not US)" }
            - { v: 13, l: "13 (not US)" }
      - dropdown:
          label: "Long-range rate"
          key: "s.espnow.rate"
          default: "250k"
          options:
            - { v: "250k", l: "250 kbps (long range)" }
            - { v: "500k", l: "500 kbps (long range)" }
      - dropdown:
          label: "On channel conflict"
          key: "s.espnow.conflict_policy"
          default: "disable"
          options:
            - { v: "disable", l: "Disable until WiFi disconnects" }
            - { v: "stay",    l: "Stay on the ESPnow channel" }
      - caption: "Stay keeps this channel and refuses to join WiFi networks on another one, leaving if they change."
      - section: "Access code"
      - caption: "IFAC: a network name + passphrase every peer on this interface must match, or traffic is dropped. Leave both blank for an open interface."
      - text: { label: "IFAC network", key: "s.espnow.ifac_netname" }
      - text: { label: "IFAC passphrase", key: "secrets.espnow.ifac_netkey", secret: true }
      - section: "Status"
      - info:
          rows:
            - value: { label: "State", key: "espnow.state_text" }
            - value: { label: "Channel", key: "espnow.channel_eff" }
              when_key: espnow.up
            - value: { label: "Rate", key: "espnow.rate_text" }
              when_key: espnow.up
            - value: { label: "WiFi", key: "espnow.wifi_text" }
              when_key: espnow.wifi_text
            - value: { label: "Frames", key: "espnow.traffic" }
